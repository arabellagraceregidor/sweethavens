<!DOCTYPE html>
<html>
    <head>
        <title>SweetHavens - Forgot Password</title>
        <link rel="stylesheet" href="home.css">
    </head>
    <body>
        <header>
            <div id="h_title-cont">
                <img src="assets/Logo.png" id="logo">
                <div><p><a id="h_title" href="home_page.html">SweetHavens</a></p></div>
            </div>
        </header>
        <div>
            <a id="login_button" href="login.html">Login</a>
            <a id="signup_button" href="signup.html">Create Account</a>
        </div>
        <div class="form_cont">
            <p class="form_header">Reset your password</p>
            <form id="forgot_form">
                <label for="reset_name">Name</label>
                <input id="reset_name" name="name" required>
                <label for="reset_age">Age</label>
                <input id="reset_age" name="age" type="number" min="1" max="120" required>
                <label for="reset_email">Gmail</label>
                <input id="reset_email" name="email" type="email" required>
                <label for="reset_password">New Password</label>
                <input id="reset_password" name="password" type="password" minlength="6" required>
                <label for="reset_confirm">Confirm Password</label>
                <input id="reset_confirm" name="confirm" type="password" minlength="6" required>
                <p class="form_msg" id="forgot_msg"></p>
                <button class="btn_dark" type="submit">Update Password</button>
                <p><a href="login.html">Back to Login</a></p>
            </form>
        </div>
        <script src="site.js"></script>
        <script src="customer.js"></script>
    </body>
</html>
