<!DOCTYPE html>
<html>
    <head>
        <title>SweetHavens - Forgot Password</title>
        <link rel="stylesheet" href="home.css">
    </head>
    <body>
        <header>
            <div id="h_title-cont">
                <img src="assets/Logo.png" id="logo">
                <div><p><a id="h_title" href="home_page.html">SweetHavens</a></p></div>
            </div>
        </header>
        <div>
            <a id="login_button" href="login.html">Login</a>
            <a id="signup_button" href="signup.html">Create Account</a>
        </div>
        <div class="form_cont">
            <p class="form_header">Reset your password</p>
            <form id="forgot_form" novalidate>

                <!-- Step 1: Name and Gmail -->
                <section class="sec_step" id="step_id">
                    <label for="reset_name">Name</label>
                    <input id="reset_name" name="name" placeholder="Full name on the account" autocomplete="name" required>

                    <label for="reset_email">Email Address (Gmail)</label>
                    <input id="reset_email" name="email" type="email" placeholder="example@gmail.com" autocomplete="email" required>
                    <p class="sec_hint" id="sec_hint">Enter the name and Gmail address linked to your account.</p>

                    <button class="btn_dark wide_btn" type="button" id="send_code">Send Code to Email</button>
                </section>

                <!-- Step 2: Verify 6-digit code sent to Gmail -->
                <section class="sec_step" id="step_code" hidden>
                    <p class="sec_hint" id="code_hint">We sent a 6-digit code to your Gmail.</p>

                    <label for="reset_code">Verification Code</label>
                    <input id="reset_code" name="code" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code">
                    <small class="fhint" id="code_timer"></small>

                    <button class="btn_dark wide_btn" type="button" id="verify_code">Enter</button>
                    <p class="step_link"><a href="#" id="resend_code">Send a new code</a></p>
                </section>

                <!-- Step 3: Security Question after code is verified -->
                <section class="sec_step" id="step_sec" hidden>
                    <label>Security Question</label>
                    <p class="sec_hint" id="sec_question_text" style="font-weight: bold;"></p>

                    <label for="reset_answer">Security Answer</label>
                    <input id="reset_answer" name="answer" placeholder="Your answer" autocomplete="off">

                    <button class="btn_dark wide_btn" type="button" id="verify_answer">Enter</button>
                </section>

                <!-- Step 4: Change Password -->
                <section class="sec_step" id="step_pw" hidden>
                    <label for="reset_password">New Password</label>
                    <input id="reset_password" name="password" type="password" placeholder="New Password" required>
                    <small class="fhint" id="reset_pw_hint">Use 8+ characters with A-Z, a-z, 0-9 and a symbol.</small>

                    <label for="reset_confirm">Confirm Password</label>
                    <input id="reset_confirm" name="confirm" type="password" placeholder="Confirm Password" required>
                    <button class="btn_dark wide_btn" type="submit">Update Password</button>
                </section>

                <p class="form_msg" id="forgot_msg"></p>
                <p><a href="login.html">Back to Login</a></p>
            </form>
        </div>

        <!-- EmailJS SDK para sa automated Gmail sending -->
        <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
        <script src="site.js"></script>
        <script src="auth.js"></script>
    </body>
</html>
