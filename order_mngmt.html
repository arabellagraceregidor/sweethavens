<!DOCTYPE html>
<html>
    <head>
        <title>SweetHavens</title>
        <link rel="stylesheet" href="home.css">
    </head>
    <body>
        <header>
            <div id="h_title-cont">
                <img src="assets/Logo.png" id="logo">
                <div><p><a id="h_title" href="dashboard.html">SweetHavens</a></p></div>
            </div>

            <!-- Header Navigation buttons-->
            <div id="nav_buttons">
                <div><nav><a class="nav1" href="dashboard.html">Dashboard</a></nav></div>
                <div><a class="nav1" href="create_products.html">Create</a></div>
                <div><a class="nav1" href="inventory.html">Inventory</a></div>
                <div><a class="nav1" href="schedule_mngmt.html">Schedules</a></div>
                <div><a class="nav1" href="order_mngmt.html">Orders</a></div>
                <div><a class="nav1">Menu</a></div>

                    <!-- Temporary login button-->
                <div><a href="login.html"><img src="assets/user.png" id="pfp_btn"></a></div>
            </div>
        </header>
        
        <main>
            <h1>Order Management</h1>
            <form>
                <label for="branch">Branch:</label>
                <input list="location" name="branch" placeholder="--">
                <datalist id="location">
                    <option value="TUP-M">
                </datalist>
            </form>

            <!--List of Orders-->
            <section id="pending-orders">
                <h2>Customer Orders</h2>
                <table>
                    <tr>
                        <th>Branch</th>
                        <th>Order #</th>
                        <th>Product description</th>
                        <th>Qty</th>
                        <th>Unit Price</th>
                        <th>Total</th>
                        <th>Status</th>
                    </tr>
                    <!--Sample-->
                    <tr>
                        <td>TUP-M</td>
                        <td>0001</td>
                        <td>Matcha Melties</td>
                        <td>5</td>
                        <td>50</td>
                        <td>250</td>
                        <td>Ready for pick up</td>
                    </tr>
                </table>
            </section>
            <section>
                <h2>Update order</h2>
                <form>
                    <label for="order">Order #:</label>
                    <input list="number" name="order" placeholder="--">
                    <datalist id="number">
                        <option value="0001">
                    </datalist>
                    <label for="status">Status:</label>
                    <input list="upd" name="status" placeholder="--">
                    <datalist id="upd">
                        <option value="pending">
                        <option value="processing">
                        <option value="packaging">
                        <option value="Ready for pick-up">
                        <option value="Received by buyer">
                        <option value="Ready for delivery">
                        <option value="Cookies on the way">
                        <option value="Arrived at destination">
                    </datalist>
                </form>
            </section>
        </main>
    </body>
</html>
