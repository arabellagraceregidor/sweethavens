<!DOCTYPE html>
<html>
    <head>
        <title>SweetHavens</title>
        <link rel="stylesheet" href="home.css">
    </head>
    <body>
        <header>
            <div id="h_title-cont">
                <img src="assets/Logo.png" id="logo">
                <div><p><a id="h_title" href="home_page.html">SweetHavens</a></p></div>
            </div>
        </header>

        <!-- Opening page -->
        <section class="landing_hero">
            <img class="landing_logo" src="assets/Logo.png" alt="SweetHavens logo">
            <h1 class="landing_brand">SweetHavens</h1>
            <div class="landing_panel">
                <p class="landing_tag">A sweet bliss in every bite!</p>
                <button class="landing_go"><a href="signup.html"><svg class="spark_ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 6.3L21 10l-6.8 1.7L12 18l-2.2-6.3L3 10l6.8-1.7z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>GET STARTED</a></button>
                <p>Already have an Account? <a href="login.html">Sign In</a></p>
            </div>
        </section>
        <div>
            <section>
                <h2 style="text-align: center; margin-bottom: 30px;">Our Products</h2>
                <!--Weekly bakes section-->
                <div id="weekly" style="padding-top: 40px; margin-top: 10px;">
                    <div id="main_header" style="margin-left: 5%; margin-right: 5%;">
                        <div style="display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin-bottom:10px;">
                            <p id="date" style="margin:0;"></p>
                            <p id="store_hours_pill" style="margin:0; background:#fff0f6; border:1px solid #f2b5ce; color:#7a2e4d; padding:6px 16px; border-radius:999px; font-size:13px; font-weight:600;">
                                Store Hours: 3:00 PM - 6:30 PM
                            </p>
                        </div>
                        <h1 class="products_header">Weekly bakes</h1>
                        <p>New and returning flavors every week. Try them out!</p>
                    </div>
                    <!--product list container-->
                    <div id="product-grid" class="product-list">

                    </div>
                </div>

                <!--Best sellers section-->
                <section id="bestsellers">
                    <div id="main_header">
                        <p id="date2">Always Available</p>
                        <h1 class="products_header">Classic Flavors</h1>
                        <p>New and returning flavors every week. Try them out!</p>
                    </div>
                    <div id="classics">

                    </div>
                </section>
            </section>
        </div>

        <!--Template for type 1 product card (for js script populating)-->
        <template id="card-template">
            <div class="product-card">
                <div class="img-cont">
                    <img src="" alt="" class="product-img">
                </div>
                <div class="card-text-cont">
                    <p class="card-notif"></p>
                    <h1 class="card-header"></h1>
                    <p class="card-p"></p>
                    <div class="button-cont">
                        <button class="info-btn"></button>
                        <button class="cart-btn"><svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>Add to cart</button>
                        <button class="order-btn"></button>
                    </div>
                </div>
            </div>
        </template>

        <!--Template for type 2 product card (for js script populating)-->
        <template id="card-template2">
            <article class="product-card">
                <div class="img-cont2">
                    <img src="" alt="" class="product-img"/>
                </div>
                <div class="card-text-cont2">
                    <p class="card-notif"></p>
                    <h1 class="card-header"></h1>
                    <p class="card-p"></p>
                    <div class="button-cont">
                        <button class="info-btn"></button>
                        <button type="button" class="cart-btn"><svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>Add to cart</button>
                        <button class="order-btn"></button>
                    </div>
                </div>
            </article>
        </template>
        <script src="list.js"></script>
        <script src="site.js"></script>
    </body>
</html>
