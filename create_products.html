<!DOCTYPE html>
<html>
    <head>
        <title>SweetHavens</title>
        <link rel="stylesheet" href="home.css">
    </head>
    <body>
        <header>
            <div id="h_title-cont">
                <img src="assets/Logo.png" id="logo">
                <div><p><a id="h_title" href="dashboard.html">SweetHavens</a></p></div>
            </div>

            <!-- Header Navigation buttons-->
            <div id="nav_buttons">
                <div><nav><a class="nav1" href="dashboard.html">Dashboard</a></nav></div>
                <div><a class="nav1" href="create_products.html">Create</a></div>
                <div><a class="nav1" href="inventory.html">Inventory</a></div>
                <div><a class="nav1" href="schedule_mngmt.html">Schedules</a></div>
                <div><a class="nav1" href="order_mngmt.html">Orders</a></div>
                <div><a class="nav1">Menu</a></div>

                    <!-- Temporary login button-->
                <div><a href="login.html"><img src="assets/user.png" id="pfp_btn"></a></div>
            </div>
        </header>
        <main>
            <h1>Create Products</h1>
            <form>
                <label for="flavor">Product Flavor:</label><br>
                <input type="text" id="flavor" name="password" placeholder="Matcha Melties" required><br>

                <label for="desc">Product Description:</label><br>
                <input type="text" id="desc" name="desc" placeholder="--" required><br>

                <label for="price">Product Price:</label><br>
                <input type="number" id="price" name="price" placeholder="59" required><br>

                <label for="type">Product Type:</label><br>
                <input list="type" name="type" placeholder="--" required><br>
                <datalist id="type">
                    <option value="Weekly bakes">
                    <option value="Classic Flavors">
                </datalist>

                <!--Temporary nav link to dashboard-->
                <button type="submit"><a href="dashboard.html">Add Product</a></button>
            </form>
        </main>
    </body>
</html>
