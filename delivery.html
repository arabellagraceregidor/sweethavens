<!DOCTYPE html>
<html>
    <head>
        <title>SweetHavens</title>
        <link rel="stylesheet" href="home.css">
    </head>
    <body>
        <header>
            <div id="h_title-cont">
                <img src="assets/Logo.png" id="logo">
                <div><p><a id="h_title" href="home_page.html">SweetHavens</a></p></div>
            </div>

            <!-- Header Navigation buttons-->
            <div id="nav_buttons">
                <div><nav><a class="nav1" href="map.html">Nearest Shop</a></nav></div>
                <div><a class="nav1" href="about.html">About Us</a></div>
                <div><a class="nav1" href="cart.html">Cart</a></div>
                <div><a class="nav1">Menu</a></div>

                    <!-- Temporary login button-->
                <div><a href="login.html"><img src="assets/user.png" id="pfp_btn"></a></div>
            </div>
        </header>
        
        <!--Delivery form container-->
        <div class="delivery-container">

            <!--Delivery method buttons-->
            <h1>Delivery Options</h1>
            <div class="buttons">
                <button class="option-btn">Delivery</button>
                <button class="option-btn">Pick Up</button>
            </div>

            <!--Address form-->
            <form>
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" required><br><br>
                <label id="method_label">Payment Method:</label>
                <input type="hidden" id="method" name="method" value="" required>
                <div class="pay_methods" id="pay_methods" role="group" aria-labelledby="method_label">
                    <button type="button" class="pay_opt" data-pay="cash">Cash on Delivery</button>
                    <button type="button" class="pay_opt" data-pay="credit">Credit/Debit Card</button>
                    <button type="button" class="pay_opt" data-pay="gcash">GCash</button>
                </div>
            </form>

            <!-- Credit/Debit Card payment -->
            <div class="pay_panel pay_card" id="card_checkout" hidden>
                <div class="pay_badge">Card</div>
                <h2>Card Payment</h2>
                <p class="pay_hint">Enter your card details to pay securely.</p>
                <div class="pay_grid">
                    <div class="full">
                        <label for="card_name">Name on card</label>
                        <input type="text" id="card_name" name="card_name" placeholder="Jane Doe" autocomplete="cc-name">
                    </div>
                    <div class="full">
                        <label for="card_number">Card number</label>
                        <input type="text" id="card_number" name="card_number" placeholder="1234 5678 9012" inputmode="numeric" autocomplete="cc-number" maxlength="19">
                    </div>
                    <div>
                        <label for="card_exp">Expiry</label>
                        <input type="text" id="card_exp" name="card_exp" placeholder="MM/YY" inputmode="numeric" autocomplete="cc-exp" maxlength="5">
                    </div>
                    <div>
                        <label for="card_cvc">CVC</label>
                        <input type="text" id="card_cvc" name="card_cvc" placeholder="123" inputmode="numeric" autocomplete="cc-csc" maxlength="4">
                    </div>
                </div>
                <p class="pay_msg" id="card_msg"></p>
            </div>

            <!-- GCash payment -->
            <div class="pay_panel pay_gcash" id="gcash_checkout" hidden>
                <div class="pay_badge">GCash</div>
                <h2>GCash Payment</h2>
                <p class="pay_hint">Enter your GCash mobile number and MPIN to pay.</p>
                <div class="pay_grid">
                    <div class="full">
                        <label for="gc_name">Account name</label>
                        <input type="text" id="gc_name" name="gc_name" placeholder="Juan Dela Cruz" autocomplete="name">
                    </div>
                    <div class="full">
                        <label for="gc_num">GCash number</label>
                        <input type="text" id="gc_num" name="gc_num" placeholder="09123456789" inputmode="numeric" maxlength="11" autocomplete="tel">
                    </div>
                    <div class="full">
                        <label for="gc_pin">MPIN</label>
                        <input type="password" id="gc_pin" name="gc_pin" placeholder="4–6 digit MPIN" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
                    </div>
                </div>
                <p class="pay_msg" id="gc_msg"></p>
            </div>

            <!--Order Summary-->
            <div class="summary">
                <h2>Order Summary</h2>
                <div>
                    <p>Subtotal:</p>
                    <p>₱ 50.00</p>
                </div>
                <div>
                    <p>Delivery Fee:</p>
                    <p>₱ 50.00</p>
                </div>
                <div>
                    <p>Total:</p>
                    <p>₱ 100.00</p>
                </div>
            </div>

            <!--Nav to order finished screen-->
                <button type="submit"><a href="orderfinished.html">Place Order</a></button>
        </div>
        <script src="site.js"></script>
        <script src="shop.js"></script>
    </body>
</html>
