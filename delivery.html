<!DOCTYPE html>
<html>
    <head>
        <title>SweetHavens</title>
        <link rel="stylesheet" href="home.css">
    </head>
    <body>
        <header>
            <div id="h_title-cont">
                <img src="assets/Logo.png" id="logo">
                <div><p><a id="h_title" href="home_page.html">SweetHavens</a></p></div>
            </div>

            <!-- Header Navigation buttons-->
            <div id="nav_buttons">
                <div><nav><a class="nav1" href="map.html">Nearest Shop</a></nav></div>
                <div><a class="nav1" href="about.html">About Us</a></div>
                <div><a class="nav1" href="cart.html">Cart</a></div>
                <div><a class="nav1">Menu</a></div>

                    <!-- Temporary login button-->
                <div><a href="login.html"><img src="assets/user.png" id="pfp_btn"></a></div>
            </div>
        </header>
        
        <!--Delivery form container-->
        <div class="delivery-container">

            <!--Delivery method buttons-->
            <h1>Delivery Options</h1>
            <div class="buttons">
                <button class="option-btn">Delivery</button>
                <button class="option-btn">Pick Up</button>
            </div>

            <!--Address form-->
            <form>
                <div id="address_field">
                    <label for="address">Address:</label>
                    <input type="text" id="address" name="address" required><br><br>
                </div>
                <label id="method_label">Payment Method:</label>
                <input type="hidden" id="method" name="method" value="" required>
                <div class="pay_methods" id="pay_methods" role="group" aria-labelledby="method_label">
                    <button type="button" class="pay_opt" data-pay="cash">Cash on Delivery</button>
                    <button type="button" class="pay_opt" data-pay="gcash">GCash</button>
                </div>
            </form>

            <script>
                (function () {
                    var btns = document.querySelectorAll('.buttons .option-btn');
                    var addrField = document.getElementById('address_field');
                    var addrInput = document.getElementById('address');

                    function toggleAddress(isPickUp) {
                        if (addrField) addrField.hidden = isPickUp;
                        if (addrInput) addrInput.required = !isPickUp;
                    }

                    btns.forEach(function (btn) {
                        if (btn.classList.contains('active') && btn.textContent.trim().toLowerCase() === 'pick up') {
                            toggleAddress(true);
                        }
                        btn.addEventListener('click', function () {
                            toggleAddress(btn.textContent.trim().toLowerCase() === 'pick up');
                        });
                    });
                })();
            </script>

            <!-- GCash payment -->
            <div class="pay_panel pay_gcash" id="gcash_checkout" hidden>
                <div class="pay_badge">GCash</div>
                <h2>GCash Payment</h2>
                <p class="pay_hint">Enter your GCash number, then upload a photo of your GCash receipt.</p>
                <div class="pay_grid">
                    <div class="full">
                        <label for="gc_name">Account name</label>
                        <input type="text" id="gc_name" name="gc_name" placeholder="Juan Dela Cruz" autocomplete="name">
                    </div>
                    <div class="full">
                        <label for="gc_num">GCash number</label>
                        <input type="text" id="gc_num" name="gc_num" placeholder="09XX XXX XXXX" inputmode="numeric" maxlength="13" autocomplete="tel">
                    </div>
                    <div class="full">
                        <label for="gc_file">GCash receipt</label>
                        <div class="photo_row" data-upload>
                            <div class="photo_prev" id="gc_prev"></div>
                            <input type="file" id="gc_file" accept="image/*" hidden>
                            <button type="button" class="btn_dark" id="gc_pick">Upload receipt</button>
                            <span id="gc_fn">No receipt uploaded</span>
                        </div>
                    </div>
                </div>
                <p class="pay_msg" id="gc_msg"></p>
            </div>

            <!--Order Summary-->
            <div class="summary">
                <h2>Order Summary</h2>
                <div>
                    <p>Subtotal:</p>
                    <p>₱ 50.00</p>
                </div>
                <div>
                    <p>Delivery Fee:</p>
                    <p>₱ 50.00</p>
                </div>
                <div>
                    <p>Total:</p>
                    <p>₱ 100.00</p>
                </div>
            </div>

            <!--Nav to order finished screen-->
                <button type="submit"><a href="orderfinished.html">Place Order</a></button>
        </div>
        <script src="site.js"></script>
        <script src="shop.js"></script>
    </body>
