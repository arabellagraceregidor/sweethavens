<!DOCTYPE html>
<html>
    <head>
        <title>SweetHavens - Schedules</title>
        <link rel="stylesheet" href="home.css">
    </head>
    <body>
        <header>
            <div id="h_title-cont">
                <img src="assets/Logo.png" id="logo">
                <div><p><a id="h_title" href="home_page.html">SweetHavens</a></p></div>
            </div>

            <!-- Header Navigation buttons-->
            <div id="admin_nav_buttons">
                <div><nav><a class="nav1" href="dashboard.html">Dashboard</a></nav></div>
                <div><a class="nav1" href="create_products.html">Create</a></div>
                <div><a class="nav1" href="inventory.html">Inventory</a></div>
                <div><a class="nav1" href="schedule_mngmt.html">Schedules</a></div>
                <div><a class="nav1" href="admin_orders.html">Orders</a></div>
                <div><a class="nav1">Menu</a></div>

                    <!-- Temporary login button-->
                <div><a href="login.html"><img src="assets/user.png" id="pfp_btn"></a></div>
            </div>
        </header>

        <div class="admin_cont">
            <h1>SweetHavens Branches</h1>
            <p class="sub">View branch locations and update store hours</p>

            <div class="panel2">
                <h2>Branch schedules</h2>
                <div class="tbl_wrap">
                    <table class="tbl">
                        <tr>
                            <th>Branch name</th>
                            <th>Location</th>
                            <th>Store Hours</th>
                        </tr>
                        <!--Sample Schedule-->
                        <tr>
                            <td>Technological University of the Philippines - Manila</td>
                            <td>Ermita, Manila</td>
                            <td><span class="pill_s">9:00 AM - 5:00 PM</span></td>
                        </tr>
                    </table>
                </div>
            </div>

            <div class="panel2">
                <h2>Update Store Hours</h2>
                <form>
                    <div class="ap_grid">
                        <div class="full">
                            <label for="branch">Branch Name</label>
                            <input type="text" list="name" id="branch" name="branch" placeholder="Select a branch" required>
                            <datalist id="name">
                                <option value="Technological University of the Philippines - Manila">
                            </datalist>
                        </div>
                        <div class="full">
                            <label for="sched">New Schedule</label>
                            <input type="text" name="sched" id="sched" placeholder="9:00 AM - 5:00 PM" required>
                        </div>
                    </div>
                    <button type="submit" class="btn_dark">Update</button>
                </form>
            </div>
        </div>
        <script src="site.js"></script>
        <script src="admin.js"></script>
    </body>
</html>
