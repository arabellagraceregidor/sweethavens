<!DOCTYPE html>
<html>
    <head>
        <title>SweetHavens - My Account</title>
        <link rel="stylesheet" href="home.css">
    </head>
    <body>
        <header>
            <div id="h_title-cont">
                <img src="assets/Logo.png" id="logo">
                <div><p><a id="h_title" href="home_page.html">SweetHavens</a></p></div>
            </div>
            <div id="nav_buttons">
                <div><nav><a class="nav1" href="map.html">Nearest Shop</a></nav></div>
                <div><a class="nav1" href="about.html">About Us</a></div>
                <div><a class="nav1" href="cart.html">Cart</a></div>
                <div><a class="nav1" href="home_page.html#weekly">Menu</a></div>
                <div><a href="login.html"><img src="assets/user.png" id="pfp_btn"></a></div>
            </div>
        </header>
        <main class="orders_cont">
        <div class="form_cont">
            <p class="form_header">My Account</p>
            <form id="account_form">
                <label for="account_name">Name</label>
                <input id="account_name" name="name" required>
                <label for="account_age">Age</label>
                <input id="account_age" name="age" type="number" min="1" max="120">
                <label for="account_sex">Sex</label>
                <input id="account_sex" name="sex">
                <label for="account_email">Gmail</label>
                <input id="account_email" name="email" type="email">
                <label for="account_contact">Contact Number</label>
                <input id="account_contact" name="contact" inputmode="numeric" maxlength="11">
                <label for="account_address">House/Unit No. and Street</label>
                <input id="account_address" name="address">
                <label for="account_region">Region</label>
                <input id="account_region" name="region">
                <label for="account_city">City/Municipality</label>
                <input id="account_city" name="city">
                <label for="account_brgy">Barangay</label>
                <input id="account_brgy" name="brgy">
                <label for="account_zip">ZIP Code</label>
                <input id="account_zip" name="zip">
                <label for="account_landmark">Landmark/Delivery Notes</label>
                <input id="account_landmark" name="landmark">
                <p class="form_msg" id="account_msg"></p>
                <button class="btn_dark" type="submit">Save Changes</button>
            </form>
        </div>
        </main>
        <script src="site.js"></script>
        <script src="customer.js"></script>
    </body>
</html>
