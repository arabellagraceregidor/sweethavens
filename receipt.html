<!DOCTYPE html>
<html>
    <head>
        <title>SweetHavens - Receipt</title>
        <link rel="stylesheet" href="home.css">
        <style>
            #receipt .thermal-paper{position:relative;width:80mm;max-width:100%;box-sizing:border-box;margin:0 auto;padding:20px 16px 24px;overflow:hidden;border:1px solid #d3d3d3;border-radius:0;background:#fff;color:#111;box-shadow:0 8px 24px rgba(0,0,0,.14);font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;animation:receiptFeed 2.4s steps(30,end) both}
            #receipt .thermal-paper *{box-sizing:border-box;color:#111;font-family:inherit}
            #receipt .receipt_brand,#receipt .receipt_caption,#receipt .receipt_thanks{text-align:center}
            #receipt .receipt_brand{font-size:18px;font-weight:700;letter-spacing:1px}
            #receipt .receipt_caption{margin:2px 0 14px;font-size:11px;text-transform:uppercase}
            #receipt .receipt_head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;border-top:1px dashed #111;padding-top:8px}
            #receipt .thermal-paper h3{margin:10px 0 4px;font-size:12px;font-weight:700;text-transform:uppercase}
            #receipt .receipt_in{display:block;width:auto;min-width:0;margin:0;padding:0;border:0;border-radius:0;font-size:12px;overflow-wrap:anywhere}
            #receipt .receipt_line{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:12px;line-height:1.45}
            #receipt .thermal-paper .receipt_line[style]{font-size:12px!important}
            #receipt .receipt_line span{min-width:0;overflow-wrap:anywhere}
            #receipt .receipt_line b{white-space:nowrap}
            #receipt .thermal-paper hr{height:0;margin:10px 0;border:0;border-top:1px dashed #111}
            #receipt .receipt_line.tot{margin-top:4px;padding-top:8px;border-top:1px solid #111;font-weight:700}
            #receipt .receipt_thanks{margin:16px 0 0;padding-top:10px;border-top:1px dashed #111;font-weight:700}
            @keyframes receiptFeed{from{clip-path:inset(0 0 100%);transform:translateY(-12px)}to{clip-path:inset(0 0 0);transform:translateY(0)}}
            @media(prefers-reduced-motion:reduce){#receipt .thermal-paper{animation:none;clip-path:none}}
            @media print{body{margin:0!important;padding:0!important;background:#fff!important}header,.receipt_cont>h1,.receipt_cont>div:last-child,#theme{display:none!important}.receipt_cont{margin:0!important;padding:0!important}.receipt_cont #receipt{margin:0!important}.receipt_cont #receipt .thermal-paper{width:80mm;max-width:none;margin:0;padding:4mm;border:0;box-shadow:none;animation:none;clip-path:none}}
        </style>
    </head>
    <body>
        <header>
            <div id="h_title-cont">
                <img src="assets/Logo.png" id="logo">
                <div><p><a id="h_title" href="home_page.html">SweetHavens</a></p></div>
            </div>

            <!-- Header Navigation buttons-->
            <div id="nav_buttons">
                <div><nav><a class="nav1" href="map.html">Nearest Shop</a></nav></div>
                <div><a class="nav1" href="about.html">About Us</a></div>
                <div><a class="nav1" href="cart.html">Cart</a></div>
                <div><a class="nav1">Menu</a></div>

                    <!-- Temporary login button-->
                <div><a href="login.html"><img src="assets/user.png" id="pfp_btn"></a></div>
            </div>
        </header>

        <!--Receipt container-->
        <div class="receipt_cont">
            <h1>YOUR RECEIPT</h1>
            <div id="receipt"></div>
            <div style="text-align:center;margin-top:20px"><button class="btn_dark"><a href="home_page.html">Back to Home</a></button></div>
        </div>
        <script src="site.js"></script>
        <script src="shop.js"></script>
    </body>
</html>
