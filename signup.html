<!DOCTYPE html>
<html>
    <head>
        <title>SweetHavens</title>
        <link rel="stylesheet" href="home.css">
    </head>
    <body>
        <header>
            <div id="h_title-cont">
                <div><img id="logo" src="assets/Logo.png"></div>
                <div><p><a id="h_title" href="home_page.html">SweetHavens</a></p></div>
            </div>
        </header>

        <!-- login and signup nav -->
        <div>
            <a id="login_button" href="login.html">Login</a>
            <a id="signup_button" href="signup.html">Create Account</a>
        </div>

        <!-- form container -->
        <div class="form_cont">
        <p class="form_header">Create your account to start ordering your favorite treats.</p>
        <form id="signup_form" novalidate>

            <!-- First name field -->
            <label for="f_name">First Name</label><br>
            <input type="text" id="f_name" name="f_name" placeholder="First Name" required><br>

            <!-- Last name field -->
            <label for="l_name">Last Name</label><br>
            <input type="text" id="l_name" name="l_name" placeholder="Last Name" required><br><br>

            <!-- Password fields -->
            <label for="c_password">Create Password</label><br>
            <input type="password" id="c_password" name="c_password" placeholder="Password" required><br>
            <label for="confirm_password">Confirm Password</label><br>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required><br><br>

            <!-- age field -->
            <label for="age">Age</label><br>
            <input type="number" id="age" name="age" placeholder="Age" min="1" max="120" inputmode="numeric" required><br><br>

            <!-- sex field -->
            <label for="sex">Sex</label><br>
            <input list="sex" id="sex" name="sex" placeholder="Sex" required><br><br>
            <datalist id="sex">
                <option value="Male">
                <option value="Female">
                <option value="Prefer not to say">
            </datalist>

            <!-- gmail field -->
            <label for="email">Gmail</label><br>
            <input type="text" id="email" name="email" placeholder="example@gmail.com" required><br><br>

            <!-- contact number field (09XX XXX XXXX) -->
            <label for="contact">Contact Number</label><br>
            <input type="text" id="contact" name="contact" inputmode="numeric" maxlength="13" placeholder="09XX XXX XXXX" required><br><br>

            <!-- Full address fields -->
            <label for="address">Address (House/Unit No. and Street)</label><br>
            <input type="text" id="address" name="address" placeholder="1234 Kalye Street" required><br>

            <label for="region">Region</label><br>
            <select id="region" name="region" required>
                <option value="">Choose your region</option>
                <option>NCR</option>
                <option>CAR</option>
                <option>Region I</option>
                <option>Region II</option>
                <option>Region III</option>
                <option>Region IV-A</option>
                <option>MIMAROPA</option>
                <option>Region V</option>
                <option>Region VI</option>
                <option>Region VII</option>
                <option>Region VIII</option>
                <option>Region IX</option>
                <option>Region X</option>
                <option>Region XI</option>
                <option>Region XII</option>
                <option>Region XIII</option>
                <option>BARMM</option>
            </select><br>

            <label for="city">City/Municipality</label><br>
            <select id="city" name="city" required disabled>
                <option value="">Choose your region first</option>
            </select><br>

            <label for="brgy">Barangay</label><br>
            <select id="brgy" name="brgy" required disabled>
                <option value="">Choose your city/municipality first</option>
            </select><br>

            <label for="zip">Zip Code</label><br>
            <input type="text" id="zip" name="zip" inputmode="numeric" maxlength="4" placeholder="****" required><br>

            <label for="landmark">Landmark/Delivery Notes</label><br>
            <input type="text" id="landmark" name="landmark" placeholder=" "><br><br>

            <!-- Security question used by Forgot Password -->
            <label for="sec_q">Security Question</label><br>
            <select id="sec_q" name="sec_q" required>
                <option value="">Choose a security question</option>
                <option>What is your mother's maiden name?</option>
                <option>What was the name of your first pet?</option>
                <option>What city were you born in?</option>
                <option>What is your favorite cookie flavor?</option>
            </select><br>

            <label for="sec_a">Your Answer</label><br>
            <input type="text" id="sec_a" name="sec_a" placeholder="Your Answer" autocomplete="off" required><br><br>

            <!-- Temporary Go to Homepage nav -->
            <button type="submit" id="login_btn"><a href="home_page.html">Sign Up</a></button>
            <p>Already have an account? <a id="login_button" href="login.html">Log In</a></p>
        </form>
        </div>
        <script src="site.js"></script>
        <script src="auth.js"></script>
    </body>
</html>
